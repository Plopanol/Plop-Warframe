[workspace]
members = ["."]
resolver = "3"

[package]
name = "plop-warframe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Recherche des meilleurs lieux de drop Warframe à partir des tables du wiki"

[dependencies]
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
