[workspace]
members = ["."]
resolver = "3"

[package]
name = "plop-warframe"
version = "0.1.10"
edition = "2024"
publish = false
license = "MIT"
description = "Recherche des meilleurs lieux de drop Warframe à partir des tables du wiki"

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.35"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "gzip"] }
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }
thiserror = "2.0.21"

[lints]
workspace = true

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "renderer-software"] }
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
